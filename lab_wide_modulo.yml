name: animal_tracking_env
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python=3.9
  
  # Core data science packages with compatible versions
  - numpy<2.0  # Pin to NumPy 1.x to avoid compatibility issues
  - pandas>=1.3.0,<2.0
  - matplotlib>=3.4.0,<4.0
  
  # Standard library enhancements (usually included but ensuring compatibility)
  - typing_extensions  # for typing support
  
  # File handling and system operations
  - pathlib  # usually included in Python 3.4+, but ensuring availability
  
  # Optional: Jupyter for data exploration
  - jupyter
  - ipykernel
  
  # Optional: Additional useful packages for data analysis
  - scipy<2.0  # Also pin scipy to avoid NumPy 2.0 issues
  - seaborn>=0.11.0,<1.0  # for enhanced plotting
  
  # Development and debugging tools (optional)
  - ipdb  # enhanced debugger
  
  # Pip packages (if any packages are not available via conda)
  - pip
  - pip:
    # Add any pip-only packages here if needed
    # - some_pip_only_package
    
prefix: ./animal_tracking_env